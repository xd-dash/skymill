name: Lock Go module dependencies
on:
  push:
    branches: [codex/scoped-requirements-qualification]
    paths:
      - go.mod
      - flake.nix
      - .github/workflows/lock-go-dependencies.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Generate and verify checksums
        run: |
          go mod tidy
          go mod verify
          go test ./...
      - name: Commit checksums
        run: |
          if git diff --quiet -- go.mod go.sum && test -f go.sum; then
            echo "Go module checksums already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "Lock verified Skymill Go dependencies"
          git push origin HEAD:codex/scoped-requirements-qualification
